{{- range $app := .Values.applications }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "{{ $app.name }}"
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "{{ $app.url }}"
    targetRevision: HEAD
    path: "{{ $app.path }}"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      enabled: true
      selfHeal: true
{{- end }}